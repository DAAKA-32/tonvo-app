name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

env:
  RELEASE_REPO: DAAKA-32/cue-desktop
  MANIFEST_REPO: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target_label: 'darwin-aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target_label: 'darwin-x86_64'
          - platform: 'ubuntu-22.04'
            args: ''
            target_label: 'linux-x86_64'
          - platform: 'windows-latest'
            args: ''
            target_label: 'windows-x86_64'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop/src-tauri -> target

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install desktop deps
        working-directory: ./desktop
        run: npm ci

      - name: Tauri build (no release — artifacts only)
        working-directory: ./desktop
        run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          TARGET_ROOT="desktop/src-tauri/target"
          # Resolve bundle dir (cross-compile targets put bundles under target/<triple>/release/)
          if [ -d "$TARGET_ROOT/aarch64-apple-darwin/release/bundle" ]; then
            BUNDLE_DIR="$TARGET_ROOT/aarch64-apple-darwin/release/bundle"
          elif [ -d "$TARGET_ROOT/x86_64-apple-darwin/release/bundle" ]; then
            BUNDLE_DIR="$TARGET_ROOT/x86_64-apple-darwin/release/bundle"
          else
            BUNDLE_DIR="$TARGET_ROOT/release/bundle"
          fi
          echo "Bundle dir: $BUNDLE_DIR"
          ls -la "$BUNDLE_DIR" || (echo "Bundle dir not found"; exit 1)
          find "$BUNDLE_DIR" -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.sig" \) -exec cp {} artifacts/ \;
          echo "--- Collected artifacts: ---"
          ls -la artifacts/
          [ "$(ls -A artifacts/ 2>/dev/null)" ] || (echo "No artifacts collected"; exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target_label }}
          path: artifacts/*
          retention-days: 7
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Resolve version
        id: release
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#desktop-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Rename artifacts to canonical (version-independent) names
        run: |
          set -e
          cd artifacts
          # Windows: Tonvo_X.Y.Z_x64-setup.exe → Tonvo-Setup.exe
          for f in Tonvo_*_x64-setup.exe; do
            [ -f "$f" ] && cp "$f" "Tonvo-Setup.exe"
          done
          for f in Tonvo_*_x64-setup.exe.sig; do
            [ -f "$f" ] && cp "$f" "Tonvo-Setup.exe.sig"
          done
          # macOS Apple Silicon
          for f in Tonvo_*_aarch64.dmg; do
            [ -f "$f" ] && cp "$f" "Tonvo-aarch64.dmg"
          done
          # macOS Intel
          for f in Tonvo_*_x64.dmg; do
            [ -f "$f" ] && cp "$f" "Tonvo-x64.dmg"
          done
          # macOS updater bundles
          for f in Tonvo_*_aarch64.app.tar.gz; do
            [ -f "$f" ] && cp "$f" "Tonvo-aarch64.app.tar.gz"
          done
          for f in Tonvo_*_aarch64.app.tar.gz.sig; do
            [ -f "$f" ] && cp "$f" "Tonvo-aarch64.app.tar.gz.sig"
          done
          for f in Tonvo_*_x64.app.tar.gz; do
            [ -f "$f" ] && cp "$f" "Tonvo-x64.app.tar.gz"
          done
          for f in Tonvo_*_x64.app.tar.gz.sig; do
            [ -f "$f" ] && cp "$f" "Tonvo-x64.app.tar.gz.sig"
          done
          # Linux AppImage
          for f in Tonvo_*_amd64.AppImage; do
            [ -f "$f" ] && cp "$f" "Tonvo.AppImage"
          done
          for f in Tonvo_*_amd64.AppImage.sig; do
            [ -f "$f" ] && cp "$f" "Tonvo.AppImage.sig"
          done
          # Linux .deb: tonvo_X.Y.Z_amd64.deb → tonvo.deb
          for f in [Tt]onvo_*_amd64.deb; do
            [ -f "$f" ] && cp "$f" "tonvo.deb"
          done
          # Remove .deb internals that shouldn't be in release
          rm -f control.tar.gz data.tar.gz
          echo "--- Final artifacts: ---"
          ls -la

      - name: Create release in cross-repo and upload assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.release.outputs.tag }}"
          gh release create "$TAG" \
            --repo "$RELEASE_REPO" \
            --title "Tonvo Desktop $TAG" \
            --notes "Tonvo Desktop $TAG

          Phase 1 builds are unsigned at the OS level.
          - **Windows:** SmartScreen will warn — click \"More info\" → \"Run anyway\"
          - **macOS:** Right-click the app → \"Open\" → \"Open\" (bypasses Gatekeeper)
          - **Linux:** \`chmod +x Tonvo.AppImage && ./Tonvo.AppImage\` or install the \`.deb\`" \
            artifacts/*

  publish-manifest:
    needs: publish-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release info
        id: release
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#desktop-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Fetch .sig files from cross-repo release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          mkdir -p /tmp/sigs
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$RELEASE_REPO" \
            --pattern '*.sig' \
            --dir /tmp/sigs --skip-existing
          ls -la /tmp/sigs

      - name: Generate latest.json
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const releaseRepo = process.env.RELEASE_REPO;
          const base = `https://github.com/${releaseRepo}/releases/download/${tag}`;

          function readSig(fname) {
            if (!fname) return '';
            try { return fs.readFileSync(path.join('/tmp/sigs', fname), 'utf-8').trim(); }
            catch { return ''; }
          }

          // Use canonical (version-independent) asset names — they're created
          // in the rename step of publish-release. The .sig files reference
          // the EXE/AppImage/tarball directly, not zipped wrappers.
          const manifest = {
            version,
            notes: `Tonvo Desktop ${tag}`,
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': {
                url: `${base}/Tonvo-Setup.exe`,
                signature: readSig('Tonvo-Setup.exe.sig'),
              },
              'darwin-aarch64': {
                url: `${base}/Tonvo-aarch64.app.tar.gz`,
                signature: readSig('Tonvo-aarch64.app.tar.gz.sig'),
              },
              'darwin-x86_64': {
                url: `${base}/Tonvo-x64.app.tar.gz`,
                signature: readSig('Tonvo-x64.app.tar.gz.sig'),
              },
              'linux-x86_64': {
                url: `${base}/Tonvo.AppImage`,
                signature: readSig('Tonvo.AppImage.sig'),
              },
            },
          };

          const outPath = path.join(process.cwd(), 'public', 'desktop-releases', 'latest.json');
          fs.mkdirSync(path.dirname(outPath), { recursive: true });
          fs.writeFileSync(outPath, JSON.stringify(manifest, null, 2) + '\n');
          console.log('Wrote manifest:', JSON.stringify(manifest, null, 2));
          EOF

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/desktop-releases/latest.json
          if git diff --staged --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "chore(desktop): publish ${{ steps.release.outputs.tag }} manifest"
          git push origin master
