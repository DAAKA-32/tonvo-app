<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tonvo · Brief D Static</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --text: #fafafa;
      --muted: #a1a1aa;
      --hairline: rgba(255, 255, 255, 0.06);
      --chrome: linear-gradient(115deg, rgba(139,139,158,0.55) 0%, #fafafa 30%, #ffffff 50%, #d8d8e8 70%, rgba(139,139,158,0.55) 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-feature-settings: 'ss01' on, 'cv11' on;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(56px, 7vh, 88px) clamp(56px, 6vw, 96px);
      position: relative;
      isolation: isolate;
    }
    /* Faint grid background — Ad11 #grid-bg primitive */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: 0.07;
      z-index: -1;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    }
    /* Ambient warm glow behind the headline */
    body::after {
      content: "";
      position: absolute;
      width: 70%; height: 50%;
      top: 25%; left: 15%;
      background: radial-gradient(circle, rgba(200,200,216,0.06), transparent 70%);
      filter: blur(80px);
      z-index: -1;
      pointer-events: none;
    }

    .top-spacer { flex: 0 0 4vh; }

    .stack {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .headline {
      font-size: var(--headline-size, 88px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--text);
      text-shadow: 0 0 40px rgba(200,200,216,0.12), 0 0 80px rgba(200,200,216,0.04);
    }
    .headline .accent {
      font-style: italic;
      font-weight: 400;
      color: var(--muted);
      text-shadow: none;
    }
    .subline {
      font-size: var(--subline-size, 32px);
      font-weight: 400;
      font-style: italic;
      color: var(--muted);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .chrome-text {
      background: var(--chrome);
      background-size: 240% 100%;
      background-position: 60% 50%;
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
              color: transparent;
      font-style: normal;
      font-weight: 600;
      filter: drop-shadow(0 0 18px rgba(200,200,216,0.25)) drop-shadow(0 0 40px rgba(200,200,216,0.10));
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding-top: 32px;
      border-top: 1px solid var(--hairline);
    }
    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.35));
    }
    .cta {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--muted);
    }
    .cta .url {
      color: var(--text);
      font-weight: 700;
    }
    .cta .arrow {
      display: inline-block;
      margin: 0 6px 0 4px;
      transform: translateY(-1px);
    }

    /* 4:5 (1080×1350) — taller frame, upsize headline per brief */
    body[data-aspect="4x5"] .headline { --headline-size: 100px; }
    body[data-aspect="4x5"] .subline  { --subline-size: 36px; }
  </style>
</head>
<body data-aspect="1x1">
  <div class="top-spacer"></div>

  <main class="stack">
    <h1 class="headline" id="headline-text">
      Your playbook is a PDF nobody <span class="accent">opens.</span>
    </h1>
    <p class="subline" id="subline-text">
      Tonvo is the playbook, <span class="chrome-text">in the call.</span>
    </p>
  </main>

  <footer class="footer">
    <img class="logo" src="logo.png" alt="Tonvo" />
    <span class="cta">
      Essai Gratuit <span class="arrow">→</span> <span class="url">tonvo.co</span>
    </span>
  </footer>

  <script>
    // Allow overriding headline + subline via URL params for variants A/B/C
    const params = new URLSearchParams(window.location.search);
    const variant = params.get('v') || 'A';
    const aspect = params.get('aspect') || '1x1';
    document.body.setAttribute('data-aspect', aspect);

    const VARIANTS = {
      A: {
        headline: 'Votre playbook est un PDF que personne <span class="accent">n’ouvre.</span>',
        subline: 'Tonvo est le playbook, <span class="chrome-text">dans l’appel.</span>',
      },
      B: {
        headline: 'Arrêtez de pitcher de <span class="accent">mémoire.</span>',
        subline: 'Tonvo détecte l’objection — <span class="chrome-text">en direct.</span>',
      },
      C: {
        // Flagged for tone-check before launch — only ship with Emilien sign-off
        headline: 'Vous êtes arrivé à vos 12 dernières démos avec un deck et une <span class="accent">vibe.</span>',
        subline: 'Les pros utilisent un <span class="chrome-text">copilote.</span>',
      },
    };

    const v = VARIANTS[variant] || VARIANTS.A;
    document.getElementById('headline-text').innerHTML = v.headline;
    document.getElementById('subline-text').innerHTML = v.subline;
    document.title = `Tonvo · Brief D Static FR · Variant ${variant} · ${aspect}`;
  </script>
</body>
</html>
